name: Release y distribución a testers

# Se dispara SOLO a mano, desde la pestaña "Actions" de GitHub (botón "Run workflow").
# El trigger automático por `push` a main está desactivado a propósito mientras se termina de
# configurar (ver GUIA-ACTUALIZACIONES.md) — para reactivarlo, descomentar las 2 líneas de abajo.
on:
  # push:
  #   branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Restaurar el keystore de firma de release (desde el secret en base64)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release-upload-key.jks"

      - name: Restaurar las credenciales de servicio de Firebase (desde el secret)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "${{ github.workspace }}/firebase-service-account.json"

      # La URL del Web App y la carpeta de Drive se hornean en el APK (ver AppConfig.kt). No están
      # versionadas — el repo es público y esa URL da acceso de lectura/escritura a la planilla —
      # así que en CI vienen de los secrets del repo.
      - name: Generar el .env con la configuración de conexión
        env:
          SCRIPT_URL: ${{ secrets.SCRIPT_URL }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          if [ -z "$SCRIPT_URL" ] || [ -z "$DRIVE_FOLDER_ID" ]; then
            echo "Faltan los secrets SCRIPT_URL y/o DRIVE_FOLDER_ID."
            echo "El APK saldría en Modo Local (Demo) y sin sincronizar. Cargalos en"
            echo "Settings > Secrets and variables > Actions y volvé a correr el workflow."
            exit 1
          fi
          {
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY"
            echo "SCRIPT_URL=$SCRIPT_URL"
            echo "DRIVE_FOLDER_ID=$DRIVE_FOLDER_ID"
          } > "${{ github.workspace }}/.env"

      - name: Compilar el APK de release y subirlo a Firebase App Distribution
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_CREDENTIALS_FILE: ${{ github.workspace }}/firebase-service-account.json
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
        run: ./gradlew assembleRelease appDistributionUploadRelease --console=plain
