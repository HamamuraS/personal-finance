name: Release y distribución a testers

# Se dispara solo con un push a main, o a mano desde la pestaña "Actions" de GitHub
# (botón "Run workflow"). Ver features/actualizaciones-sin-costo.md y GUIA-ACTUALIZACIONES.md
# para la explicación paso a paso de qué hace esto y qué secrets hay que cargar antes.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Restaurar el keystore de firma de release (desde el secret en base64)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release-upload-key.jks"

      - name: Restaurar las credenciales de servicio de Firebase (desde el secret)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "${{ github.workspace }}/firebase-service-account.json"

      - name: Compilar el APK de release y subirlo a Firebase App Distribution
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_CREDENTIALS_FILE: ${{ github.workspace }}/firebase-service-account.json
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
        run: ./gradlew assembleRelease appDistributionUploadRelease --console=plain
